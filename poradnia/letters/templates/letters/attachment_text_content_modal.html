{% load i18n %}

<div
    class="modal fade"
    id="attachmentTextModal"
    tabindex="-1"
    role="dialog"
    aria-labelledby="attachmentTextModalLabel"
>
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="{% trans 'Close' %}"
                ></button>
                <h4 class="modal-title" id="attachmentTextModalLabel">
                    {{ attachment.filename }}
                </h4>
            </div>

            <div class="modal-body">
                {% if attachment.text_content %}
                    <p class="small text-muted"><em>{{ attachment.text_content_warning }}</em></p>
                    <div class="well" style="max-height: 70vh; overflow-y: auto; white-space: pre-wrap; word-break: break-word;">
                        {{ attachment.text_content }}
                    </div>
                {% else %}
                    <em>{% trans "No extracted text available." %}</em>
                {% endif %}
            </div>
        </div>
    </div>
</div>

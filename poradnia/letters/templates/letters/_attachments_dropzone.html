{% load crispy_forms_tags i18n %}
<style>
    #selected-files {
        border: 1px solid lightgray;
    }

    .sticky_right {
        padding-right: 0;
    }

    .sticky_left {
        padding-left: 0;
    }

    .clear-button {
        margin-top: -15px;
        margin-bottom: 20px;
        margin-left: 12px;
        display: none;
    }

    #div_id_file_field {
        margin-bottom: 5px;
    }

    #drop-zone {
        background-color: #f5f5f5;
    }
</style>
<div class="row" id="drop-zone">
    <div class="col-lg-4 sticky_right">
        {% crispy attachments_form %}
        <button type="button" id="clear-files-button" class="clear-button">
            &nbsp;&nbsp;{% trans 'Clear Files' %}&nbsp;&nbsp;
        </button>
    </div>
    <div class="col-lg-8 sticky_left">
        <table class="table table-striped table-condensed" id="selected-files">
            <thead id="files-table-head">
                <tr>
                    <th style="font-size: 14px;">
                        <i class="fa-regular fa-circle-question" data-toggle="tooltip" data-placement="bottom"
                            title="{% trans 'Select multiple files with ctr or shift.' %}">
                        </i>
                        {% trans 'Selected files:' %}
                    </th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

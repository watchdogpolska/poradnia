{% load i18n %}
{# Optional `title` adds an <h2>; omit it when the including page already heads the list. #}
<div class="container">

    {% if title %}
        <div class="row">
            <div class="col-12">
                <h2>{{ title }}</h2>
            </div>
        </div>
    {% endif %}
    <div class="row">
        <div class="col-lg-12">
            <div class="list-group">
                {% if object_list %}
                    {% for object in object_list %}
                        <a{% if object.get_absolute_url %} href="{{ object.get_absolute_url }}"{% endif %}
                                                           class="list-group-item">
                            <h4 class="list-group-item-heading">{{ object }}</h4>
                        </a>
                    {% endfor %}
                {% else %}
                    <p class="list-group-item">{% trans "No items." %}</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>

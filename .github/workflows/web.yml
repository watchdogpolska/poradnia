name: Python package

on:
  # push:
  #   branches:
  #     - master
  #     - dev
  pull_request:
    types: [opened, synchronize]

jobs:
  django_build_and_test:
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     python:
    #       #           - 3.6
    #       - "3.13"
    #     django:
    #       #           - "==2.2.*"
    #       - "==4.2.*"
    steps:
      - uses: actions/checkout@v7
      # Pull the latest image to build, and avoid caching pull-only images.
      # (docker pull is faster than caching in most cases.)
      # - run: |
      #     docker compose --file docker-compose.yml --file docker-compose.test.yml pull
      #     docker pull python:${{matrix.python}}-slim
      - name: Align container user with runner UID/GID
        # docker-compose.yml defaults UID/GID to 1000, which only matches the
        # checked-out file ownership by coincidence on dev machines. Without
        # this, the "web" container can't write to the bind-mounted logs/ dir.
        run: |
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
      - name: Start database early
        run: docker compose up -d db
      - name: Build application
        run: make build
        # env:
        #   PYTHON_VERSION: ${{ matrix.python }}
      - name: Migration check
        run: make check
      - name: Show settings
        run: make settings

      - name: Regenerate frontend with gulp service
        run: |
          docker compose -f docker-compose.yml run web python manage.py collectstatic --no-input
          docker compose -f docker-compose.yml up gulp

      - name: Check for Changes in Static Files
        run: |
          git status
          if ! git diff --quiet poradnia/static/; then
            git diff
            echo "Static files needs to be updated. Exiting with code 1"
            exit 1
          else
            echo "No changes in static files."
          fi

      - name: Run unit tests
        run: make test
      - name: Run e2e tests
        run: make e2e

  # WCAG-mode checks: see tests/wcag/README.md. Playwright, not cypress-axe
  # (the equivalence test needs independent per-mode browser contexts, and
  # every timing fix this
  # tooling needed was hard-won against this app's own async widgets; redoing
  # that in Cypress's idiom would duplicate effort for no benefit). Separate
  # job (not a step in django_build_and_test above) because it needs its own
  # Node/Playwright toolchain and an isolated `poradnia_a11y` database with
  # no real client data - never reuse `poradnia`/`test_poradnia` for this.
  # Runs in parallel with django_build_and_test, not after it: this job
  # builds and migrates its own isolated stack (poradnia_a11y), so it
  # doesn't consume anything the other job produces. Serializing them was
  # pure fail-fast cost-saving (skip the ~10-15min Playwright/Chromium job
  # if the cheaper unit-test job was already going to fail the PR) at the
  # cost of roughly doubling PR wall-clock time; running in parallel trades
  # a bit of wasted CI time on broken builds for faster feedback.
  wcag_mode_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Align container user with runner UID/GID
        run: |
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
      - name: Build application
        run: make build
      - name: Create and migrate the poradnia_a11y database
        run: |
          docker compose up -d --remove-orphans db
          docker compose run web bash -c 'wait-for-it db:3306'
          docker compose exec -T db mysql -uroot -ppassword -e \
            "CREATE DATABASE IF NOT EXISTS poradnia_a11y CHARACTER SET utf8mb4 COLLATE utf8mb4_polish_ci;"
          docker compose -f docker-compose.yml -f tests/wcag/docker-compose.a11y.yml \
            run --rm web python manage.py migrate
      - name: Seed WCAG-mode sample data
        run: |
          echo "A11Y_SEED_PASSWORD=$(openssl rand -base64 24)" >> "$GITHUB_ENV"
      - name: Run seed script
        run: |
          docker compose up -d --remove-orphans maildump
          docker compose -f docker-compose.yml -f tests/wcag/docker-compose.a11y.yml \
            run --rm -e A11Y_SEED_PASSWORD="$A11Y_SEED_PASSWORD" \
            web python tests/wcag/seed_a11y.py --reset
      - name: Bring the app up against poradnia_a11y
        run: |
          docker compose -f docker-compose.yml -f tests/wcag/docker-compose.a11y.yml up -d web
      - name: Install Playwright
        working-directory: tests/wcag/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Equivalence test (normal mode vs WCAG mode, no stored baseline needed)
        working-directory: tests/wcag/playwright
        run: node equivalence_test.js
      - name: axe-core against WCAG mode
        working-directory: tests/wcag/playwright
        run: node axe_run.js --mode=wcag
      # Normal-mode regression gate. Diffs against tests/wcag/playwright/baseline/
      # (HTML + compiled-asset hashes, COMMITTED to git - small, text,
      # reviewable diffs). Screenshots are gitignored/local-only by design
      # (see tests/wcag/README.md) so the pixel-diff portion of this check
      # is a no-op in CI (logged as a NOTE, not a failure) - that's expected,
      # not a bug: a PR that changes normal-mode output fails here on the
      # HTML diff regardless, which is what actually blocks the merge; a
      # human reviews the committed HTML diff plus (by convention) a
      # screenshot attached to the PR description for the visual check.
      - name: Normal-mode baseline diff
        working-directory: tests/wcag/playwright
        run: node baseline_diff.js
      # logs/wcag/ is gitignored, but that's fine here: axe_run.js/
      # validate_html.js/equivalence_test.js write this evidence fresh
      # during the job above, so upload-artifact only needs it to exist on
      # the runner's filesystem at this point, not to be tracked in git.
      - name: Upload WCAG-mode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcag-mode-evidence
          path: logs/wcag/audit/evidence/
          retention-days: 14

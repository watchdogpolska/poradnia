name: Regenerate and update frontend

on:
  push:
    branches:
      - master
      - dev

  pull_request:

concurrency:
  group: frontend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate_and_commit_frontend:
    runs-on: ubuntu-latest
    env:
      # Renovate (Mend-hosted app) can't use postUpgradeTasks, so its PRs never
      # carry a rebuilt poradnia/static/. Rebuild and push back to the PR branch
      # instead of just failing the check.
      IS_RENOVATE: ${{ github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'renovate[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # On a pull_request event the default ref is the ephemeral
          # refs/pull/N/merge commit. We need to check out and push to the
          # real PR branch, so override the ref on Renovate PRs only.
          ref: ${{ env.IS_RENOVATE == 'true' && github.head_ref || '' }}
          # GITHUB_TOKEN-authored pushes don't trigger new workflow runs, so
          # the follow-up run on the rebuild commit would never happen.
          # Deploy-key pushes do. Empty for non-Renovate runs, so checkout
          # falls back to the default token over HTTPS.
          ssh-key: ${{ env.IS_RENOVATE == 'true' &&
            secrets.FRONTEND_BOT_SSH_KEY || '' }}
      - name: Align container user with runner UID/GID
        # docker-compose.yml defaults UID/GID to 1000, which only matches the
        # checked-out file ownership by coincidence on dev machines. Without
        # this, containers can't write to the bind-mounted repo (logs/,
        # staticfiles/, poradnia/static/).
        run: |
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
      - name: Collect statics
        run: docker compose run web python manage.py collectstatic --no-input
      - name: Build and run frontend
        run: docker compose up gulp --exit-code-from gulp
      - name: Show git status
        run: git status
      - name: Commit rebuilt frontend
        if: env.IS_RENOVATE == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          changes=$(git status --porcelain poradnia/static/ package*.json)
          if [[ -n "$changes" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "$BOT_EMAIL"
            git add poradnia/static/ package.json package-lock.json
            git commit -m "Regenerate frontend"
            git push origin "HEAD:$HEAD_REF"
          else
            echo "No pending front-end changes detected."
          fi
      - name: Require rebuild content
        if: env.IS_RENOVATE != 'true'
        run: |
          changes=$(git status --porcelain poradnia/static/ package*.json)
          if [[ -n "$changes" ]]; then
            echo "Pending changes in the front-end have been detected."
            echo "Use 'make gulp' to regenerate front-end"
            echo "and commit changes. Following changes pending:"
            git diff
            git status
            exit 1
          else
            echo "No pending front-end changes detected."
          fi
